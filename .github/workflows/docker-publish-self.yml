name:  biliup # Biliup Docker镜像构建和推送工作流

on:
  push:
    tags:
      - 'biliup-v*' 

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 设置Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录到DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: 解析标签为编译参数和构建并推送Docker镜像
        id: extract_tag
        run: |
          VERSION=${GITHUB_REF#refs/tags/biliup-v}
          docker build  -f ./Dockerfile -t biliup . 
          TAG_NAME="dahangkk/biliup:${VERSION}"
          echo "Tagging image as $TAG_NAME"
          docker tag biliup:latest $TAG_NAME
          echo "Pushing image $TAG_NAME"
          docker push $TAG_NAME
